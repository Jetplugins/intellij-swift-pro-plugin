name: Feature request
description: Suggest an improvement or new capability for Swift Pro
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: Thanks for sharing an idea for Swift Pro. Search existing issues before submitting a new request.

  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to accomplish, and what makes it difficult today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or user experience you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative approaches you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add redacted examples, screenshots, or related Swift documentation if useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this request.
          required: true
        - label: I removed confidential and personally identifiable information from this request.
          required: true
